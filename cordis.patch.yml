# dsh-tf-bhpro bundle: panel + keyword router for a TF-BHPRO BLE device.
- insert:
    - id: toy-control
      name: dsh-tf-bhpro
      config:
        # python that has `bleak` installed
        pythonPath: python
        # defaults to scripts/bt_toyctl.py inside this bundle
        scriptPath: ""
        # leave empty to scan for the device by name (scripts/bt_toyctl.py)
        # or scan with:  python scripts/scan.py
        address: ""
        # false = the model never sees a tool; the panel and the keyword router
        # drive the device, so the prompt can focus on the persona
        exposeTool: false
